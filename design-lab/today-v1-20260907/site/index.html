<!doctype html>
<html lang="ru" data-variant="companion" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11181d"><meta name="robots" content="noindex">
  <title>Satoru — Сегодня</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="character.css">
  <link rel="stylesheet" href="planner.css">
  <script src="assets/sound.js" defer></script><script type="module" src="app.js"></script>
</head>
<body>
  <div class="preview-bar"><span class="preview-label">Превью · тестовые дела</span><div class="theme-picker" role="group" aria-label="Тема оформления"><button data-theme-choice="light" aria-pressed="false">Светлая</button><button data-theme-choice="dark" aria-pressed="false">Тёмная</button><button data-theme-choice="system" aria-pressed="true">Системная</button></div><details class="preview-settings"><summary>Примеры</summary><div><label>День <select id="scenario"><option value="regular">Обычный</option><option value="dense">Плотный</option><option value="empty">Пустой</option></select></label><button id="reset" class="preview-reset">Сбросить пример</button></div></details></div>
  <div class="shell">
    <aside class="rail" aria-label="Разделы Satoru">
      <a class="wordmark" href="./" aria-label="Satoru — Сегодня"><img class="brand-mark" src="assets/shadow.png" width="40" height="40" alt="">Satoru<span class="brand-dot">/</span></a>
      <div class="rail-caption">ТВОЙ ДЕНЬ</div>
      <nav id="nav"><span class="nav-item selected" aria-current="page"><span class="nav-art nav-art-today" aria-hidden="true"></span>Сегодня</span><button class="nav-item" data-section="План"><span class="nav-art nav-art-plan" aria-hidden="true"></span>План</button><button class="nav-item" data-section="Привычки"><span class="nav-art nav-art-habits" aria-hidden="true"></span>Привычки</button><button class="nav-item" data-section="Заметки"><span class="nav-art nav-art-notes" aria-hidden="true"></span>Заметки</button></nav>
      <div class="rail-caption second-caption">МИР SATORU</div>
      <nav><button class="nav-item" data-section="Вдохновение"><span class="nav-art nav-art-inspiration" aria-hidden="true"></span>Вдохновение</button><button class="nav-item" data-section="Награды"><img class="nav-art nav-art-rewards" src="assets/nav-rewards.png" alt="" width="28" height="28">Награды</button><button class="nav-item" data-section="Герой"><span class="nav-art nav-art-hero" aria-hidden="true"></span>Герой</button><button class="nav-item" data-section="Племя"><span class="nav-art nav-art-tribe" aria-hidden="true"></span>Племя</button></nav>
      <div class="rail-bottom"><button id="sound" class="quiet sound-toggle" aria-pressed="false">♪ <span>Звук выключен</span></button><div class="profile"><span class="profile-initial">А</span><div><b>Алекс</b><span>Путешественник · ур. 12</span></div><button data-section="Профиль" class="icon-button" aria-label="Профиль"><span class="nav-art nav-art-profile" aria-hidden="true"></span></button></div></div>
    </aside>
    <main id="main">
      <div id="today-view">
      <header class="page-header"><div class="day-heading"><div class="eyebrow" id="date-label">7 СЕНТЯБРЯ · ПОНЕДЕЛЬНИК</div><h1>Сегодня</h1></div><div class="header-actions"><button class="shadow-trigger" id="shadow-open"><img src="assets/shadow.png" width="48" height="48" alt=""><span>Тень<span class="shadow-caption">Помощник</span></span><span aria-hidden="true">↗</span></button><button class="outline recap-trigger" id="recap-open"><img class="mic-symbol" src="assets/microphone.svg" width="20" height="20" alt="">Итог дня голосом</button></div></header>
      <div class="workspace">
        <section class="day-work" aria-label="Задачи дня">
          <div id="week" class="week" aria-label="Дни недели"></div>
          <div class="day-caption"><h2 id="day-title">План на день</h2><span id="day-summary"></span><button id="compose-open" class="outline">＋ Задача</button></div><div class="day-progress" id="day-progress" aria-hidden="true"></div>
          <div id="composer-home">
          <form id="composer" class="composer">
            <label class="task-name-label" for="task-name">Добавить задачу</label><input id="task-name" name="title" placeholder="Что хочешь сделать?" maxlength="160" required autocomplete="off">
            <div class="composer-fields"><label>Сфера<select name="sphere" id="new-sphere"><option>Медиа</option><option>Учёба</option><option>Тело</option><option>Быт</option><option>Отдых</option></select></label><label>Начало<input name="time" type="time" aria-label="Начало новой задачи"></label><label>Длительность<select name="minutes" aria-label="Длительность новой задачи"><option value="10">10 мин</option><option value="15">15 мин</option><option value="25" selected>25 мин</option><option value="30">30 мин</option><option value="45">45 мин</option><option value="60">1 час</option><option value="90">1 ч 30 мин</option></select></label><button class="add-button" type="submit" aria-label="Добавить задачу">＋</button></div>
          </form>
          </div>
          <div id="tasks" class="tasks"></div>
          <section class="habits-strip" aria-labelledby="habits-title"><div class="section-line"><h2 id="habits-title">Привычки на сегодня</h2><button data-section="Привычки" class="text-button">Все привычки ↗</button></div><div id="habits"></div></section>
          <div class="end-line"><span id="day-end-label"></span><button id="day-close" class="text-button">Завершить день ↗</button></div>
        </section>
        <aside class="companion" aria-label="Тень рядом">
          <div class="companion-title"><h2>Тень</h2><span>Твой помощник</span></div>
          <div class="den-scene"><img src="assets/den.jpg" class="den-art" alt="Тёплый свет фонаря в логове" width="1536" height="864"><img class="shadow-art" src="assets/shadow.png" alt="Тень" width="1024" height="1024"></div>
          <div class="shadow-message"><p id="shadow-copy"></p><button class="text-button" id="smaller-step">Нужен шаг поменьше <span aria-hidden="true">↗</span></button></div>
          <details class="support"><summary>Другая поддержка <span aria-hidden="true">＋</span></summary><button data-support="rest">Хочу отдохнуть</button><button data-support="return">Меня унесло</button><button data-support="boundary">Граница входа</button></details>
          <form class="quick-note" id="quick-note"><label for="note">Мысль на потом</label><div><input id="note" name="note" placeholder="Чтобы не держать в голове" maxlength="1000" required><button class="icon-button" aria-label="Сохранить мысль">＋</button></div></form>
          <div class="notes-feedback" id="notes-feedback" aria-live="polite"></div>
        </aside>
      </div>
      </div>
      <section id="plan-view" hidden aria-label="План"></section>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Разделы Satoru"><button data-home aria-current="page"><span class="nav-art nav-art-today" aria-hidden="true"></span>Сегодня</button><button data-section="План"><span class="nav-art nav-art-plan" aria-hidden="true"></span>План</button><button data-section="Привычки"><span class="nav-art nav-art-habits" aria-hidden="true"></span>Привычки</button><button data-section="Герой"><span class="nav-art nav-art-hero" aria-hidden="true"></span>Герой</button><button id="mobile-more"><span aria-hidden="true">···</span>Ещё</button></nav>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Закрыть">×</button></div><div id="dialog-body"></div></dialog>
</body></html>
