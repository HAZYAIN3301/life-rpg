<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Кубическая поляна">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <path d="M15 43 h98 v52 H15z" fill="#557c63" stroke="#314a42" stroke-width="4"/>
    <path d="M17 45 h96 v15 H17z" fill="#91b77c"/>
    <rect x="24" y="68" width="11" height="11" fill="#d9c99a" opacity=".72"/><rect x="40" y="84" width="11" height="11" fill="#d9c99a" opacity=".72"/><rect x="56" y="66" width="11" height="11" fill="#d9c99a" opacity=".72"/><rect x="72" y="81" width="11" height="11" fill="#d9c99a" opacity=".72"/><rect x="88" y="66" width="11" height="11" fill="#d9c99a" opacity=".72"/><rect x="104" y="84" width="11" height="11" fill="#d9c99a" opacity=".72"/>
    <path d="M17 60 h96" stroke="#a86f45" stroke-width="3" opacity=".55"/></g></g>
</svg>
