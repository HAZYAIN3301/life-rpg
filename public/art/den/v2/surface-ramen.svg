<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Рамэн-стол">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="15" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="110" rx="49" ry="8" fill="#10131e" opacity=".23"/>
    <path d="M19 69 H109 V84 H19Z M28 82 h10 v27 H28z M90 82 h10 v27 H90z" fill="#eee1c0" stroke="#3b2828" stroke-width="4"/>
    <path d="M39 50 q25 13 50 0 l-7 25 q-18 14 -36 0z" fill="#ffd27e" stroke="#3b2828" stroke-width="4"/>
    <path d="M48 47 q8 -17 0 -26 M63 47 q8 -20 0 -29 M78 47 q8 -17 0 -26" fill="none" stroke="#c8763e" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 22 L102 55 M95 20 l14 34" stroke="#7d4435" stroke-width="3"/></g></g>
</svg>
