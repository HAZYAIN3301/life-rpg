<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Плащ надежды">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <path d="M64 18 v18" stroke="#c49257" stroke-width="6" stroke-linecap="round"/>
    <path d="M46 31 q18 -12 36 0 l25 65 -28 -8 -15 22 -15 -22 -28 8z" fill="#446888" stroke="#26354b" stroke-width="4"/>
    <path d="M51 35 q13 10 26 0" fill="none" stroke="#d8e3d2" stroke-width="6"/>
    <path d="M64 47 l7 14 16 2 -12 11 4 16 -15 -8 -15 8 4 -16 -12 -11 16 -2z" fill="#c49257"/></g></g>
</svg>
