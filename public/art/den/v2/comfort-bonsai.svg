<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Бонсай пути">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="16" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="109" rx="38" ry="8" fill="#10131e" opacity=".23"/>
    <path d="M40 78 h49 l-6 29 H46Z" fill="#a86f45" stroke="#314a42" stroke-width="4"/>
    <path d="M64 79 q-16 -20 -4 -42 q18 14 7 42 M64 56 q17 -8 24 -24" fill="none" stroke="#314a42" stroke-width="8" stroke-linecap="round"/>
    <circle cx="51" cy="38" r="20" fill="#557c63"/><circle cx="74" cy="29" r="19" fill="#91b77c"/><circle cx="91" cy="43" r="17" fill="#557c63"/>
    <path d="M47 93 h35" stroke="#d9c99a" stroke-width="4"/></g></g>
</svg>
