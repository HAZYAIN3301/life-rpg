<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Лунный рыбак">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <circle cx="64" cy="62" r="43" fill="#20243e"/>
    <path d="M79 24 A39 39 0 1 0 94 91 A45 45 0 0 1 79 24Z" fill="#f4e7b4"/>
    <path d="M39 75 q18 -17 35 0" fill="none" stroke="#8293c9" stroke-width="3"/>
    <circle cx="58" cy="53" r="4" fill="#8293c9"/><circle cx="73" cy="44" r="2" fill="#8293c9"/>
    <path d="M52 45 q5 -9 10 0 l-1 27 h-8z" fill="#a56791"/><circle cx="57" cy="38" r="5" fill="#a56791"/></g></g>
</svg>
