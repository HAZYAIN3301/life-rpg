<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Стойка клинков">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="22" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="111" rx="48" ry="8" fill="#10131e" opacity=".23"/>
    <path d="M24 99 h80 M32 99 v12 M96 99 v12 M39 72 h50" stroke="#c49257" stroke-width="8" stroke-linecap="round"/>
    <path d="M43 19 l8 5 -8 58 -8 -2z M78 23 l8 -4 8 62 -8 2z" fill="#d8e3d2" stroke="#26354b" stroke-width="4"/>
    <path d="M33 77 h20 M76 79 h20" stroke="#76a8ad" stroke-width="6" stroke-linecap="round"/></g></g>
</svg>
