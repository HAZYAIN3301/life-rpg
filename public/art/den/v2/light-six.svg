<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Лампа шести огней">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="20" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="111" rx="34" ry="7" fill="#10131e" opacity=".22"/>
    <path d="M58 25 h12 v77 H58z M39 102 h50 v10 H39z" fill="#a56791" stroke="#20243e" stroke-width="4"/>
    <circle cx="64" cy="44" r="27" fill="#20243e" stroke="#8293c9" stroke-width="4"/>
    <circle cx="64" cy="29" r="6" fill="#f4e7b4"/><circle cx="64" cy="29" r="2" fill="#414b75"/><circle cx="49" cy="39" r="6" fill="#f4e7b4"/><circle cx="49" cy="39" r="2" fill="#414b75"/><circle cx="79" cy="39" r="6" fill="#f4e7b4"/><circle cx="79" cy="39" r="2" fill="#414b75"/><circle cx="49" cy="57" r="6" fill="#f4e7b4"/><circle cx="49" cy="57" r="2" fill="#414b75"/><circle cx="79" cy="57" r="6" fill="#f4e7b4"/><circle cx="79" cy="57" r="2" fill="#414b75"/><circle cx="64" cy="65" r="6" fill="#f4e7b4"/><circle cx="64" cy="65" r="2" fill="#414b75"/></g></g>
</svg>
