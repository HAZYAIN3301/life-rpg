<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Фонарь странника">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="110" rx="32" ry="8" fill="#10131e" opacity=".22"/>
    <path d="M50 21 q14 -15 28 0" fill="none" stroke="#eee1c0" stroke-width="5"/>
    <path d="M44 36 h40 l-5 61 H49Z" fill="#3b2828" stroke="#eee1c0" stroke-width="4"/>
    <path d="M52 44 h24 l-3 42 H55Z" fill="url(#glow)"/>
    <path d="M42 34 h44 M45 97 h38" stroke="#ffd27e" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 54 q13 18 0 27 q-13 -10 0 -27z" fill="#eee1c0"/></g></g>
</svg>
