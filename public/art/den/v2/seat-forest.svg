<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Лесное кресло">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="108" rx="47" ry="10" fill="#10131e" opacity=".26"/>
    <path d="M30 32 q5 -20 19 -5 q13 -12 30 0 q14 -15 20 6 l10 57 q-15 19 -45 19 q-29 0 -45 -19z" fill="#557c63" stroke="#314a42" stroke-width="4"/>
    <path d="M43 27 l-9 -15 q20 0 25 16 M83 28 l11 -15 q12 14 3 26" fill="#91b77c" stroke="#314a42" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="50" cy="58" r="4" fill="#314a42"/><circle cx="78" cy="58" r="4" fill="#314a42"/>
    <path d="M57 70 q7 7 14 0" fill="none" stroke="#d9c99a" stroke-width="3"/></g></g>
</svg>
