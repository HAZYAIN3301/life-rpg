<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Костёр племени">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="108" rx="48" ry="11" fill="#10131e" opacity=".24"/>
    <path d="M28 95 l72 13 M100 95 l-72 13" stroke="#eee1c0" stroke-width="11" stroke-linecap="round"/>
    <path d="M64 23 q29 37 3 70 q-35 -16 -15 -45 q4 13 12 18 q13 -18 0 -43z" fill="#c8763e" stroke="#3b2828" stroke-width="4"/>
    <path d="M64 48 q16 25 0 39 q-17 -10 0 -39z" fill="#ffd27e"/></g></g>
</svg>
