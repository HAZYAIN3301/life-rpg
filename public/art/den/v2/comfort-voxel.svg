<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Кубический очаг">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <ellipse cx="64" cy="111" rx="50" ry="8" fill="#10131e" opacity=".25"/>
    <path d="M17 44 H111 V105 H17Z" fill="#557c63" stroke="#314a42" stroke-width="4"/>
    <path d="M28 57 H100 V105 H28Z" fill="#314a42"/>
    <path d="M39 69 h15 v15 H39z M55 55 h15 v15 H55z M70 70 h15 v15 H70z M55 84 h15 v15 H55z" fill="#a86f45"/>
    <path d="M17 44 l15 -15 h64 l15 15" fill="#91b77c" stroke="#314a42" stroke-width="4"/>
    <path d="M88 33 v12 M41 33 v12" stroke="#d9c99a" stroke-width="5"/></g></g>
</svg>
