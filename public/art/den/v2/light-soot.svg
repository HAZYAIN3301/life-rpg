<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Духи-копотушки">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090b16" flood-opacity=".38"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c9"/><stop offset="1" stop-color="#ffb34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><g filter="url(#paper)">
    <path d="M25 91 q17 -19 34 0 q16 -23 34 0" fill="none" stroke="#f0dfb8" stroke-width="4"/>
    <circle cx="28" cy="43" r="11" fill="#33273d" stroke="#a36f88" stroke-width="3"/><circle cx="25" cy="42" r="2" fill="#e4bea6"/><circle cx="31" cy="42" r="2" fill="#e4bea6"/><circle cx="52" cy="31" r="9" fill="#33273d" stroke="#a36f88" stroke-width="3"/><circle cx="49" cy="30" r="2" fill="#e4bea6"/><circle cx="55" cy="30" r="2" fill="#e4bea6"/><circle cx="76" cy="45" r="11" fill="#33273d" stroke="#a36f88" stroke-width="3"/><circle cx="73" cy="44" r="2" fill="#e4bea6"/><circle cx="79" cy="44" r="2" fill="#e4bea6"/><circle cx="99" cy="30" r="9" fill="#33273d" stroke="#a36f88" stroke-width="3"/><circle cx="96" cy="29" r="2" fill="#e4bea6"/><circle cx="102" cy="29" r="2" fill="#e4bea6"/><circle cx="42" cy="72" r="11" fill="#33273d" stroke="#a36f88" stroke-width="3"/><circle cx="39" cy="71" r="2" fill="#e4bea6"/><circle cx="45" cy="71" r="2" fill="#e4bea6"/><circle cx="86" cy="72" r="9" fill="#33273d" stroke="#a36f88" stroke-width="3"/><circle cx="83" cy="71" r="2" fill="#e4bea6"/><circle cx="89" cy="71" r="2" fill="#e4bea6"/>
    <circle cx="21" cy="20" r="3" fill="#f0dfb8"/><circle cx="108" cy="58" r="3" fill="#f0dfb8"/><circle cx="70" cy="16" r="2.5" fill="#f0dfb8"/></g></g>
</svg>
