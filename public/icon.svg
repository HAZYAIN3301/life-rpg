<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2640"/>
      <stop offset="1" stop-color="#0f1320"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#9b7cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- XP-кольцо прогресса -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2a3250" stroke-width="26"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#xp)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="707 943" transform="rotate(-90 256 256)"/>
  <!-- Стилизованные мечи (бренд ⚔️) -->
  <g stroke="#e7ebf5" stroke-width="22" stroke-linecap="round" fill="none">
    <line x1="190" y1="190" x2="322" y2="322"/>
    <line x1="322" y1="190" x2="190" y2="322"/>
  </g>
  <circle cx="256" cy="256" r="20" fill="#ffd479"/>
</svg>
