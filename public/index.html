<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gojo</title>
  <!-- Установка на телефон как приложение (Add to Home Screen) + тёмный фон браузер-хрома -->
  <meta name="theme-color" content="#0f1320" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gojo" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="logo">⚔️</span>
        <h1 id="appName">Gojo</h1>
      </div>
      <div id="charSummary" class="char-summary"></div>
      <nav id="nav">
        <button data-view="today" class="active">Сегодня</button>
        <button data-view="character">Персонаж</button>
        <button data-view="goals">Цели</button>
        <button data-view="tree">Навыки</button>
        <button data-view="rewards">Награды</button>
        <button data-view="weekly">Неделя</button>
        <button data-view="stats">Статистика</button>
        <button data-view="leaderboard">Рейтинг</button>
        <button data-view="settings">Настройки</button>
      </nav>
    </header>
    <main id="main"></main>
    <div id="toasts"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
