</style></head><body><header><strong>Satoru · B2.12</strong><button data-width="375">375</button><button data-width="390" aria-pressed="true">390</button><button data-width="1280">Компьютер</button><a href="/redesign/phone.html?screen=start">Стартовый экран</a><a href="/redesign/phone.html?screen=goals">Цели</a><a href="/redesign/phone.html?screen=world">Мир</a><a href="/redesign/phone.html?screen=rewards">Награды</a><a href="/redesign/phone.html?screen=settings">Настройки</a><a href="/redesign/preview.html">Эталон B2.7</a><a href="/redesign/live.html">На весь экран</a></header><p>Сегодня, План, Мир, Награды и Настройки — данные тестового аккаунта. Племя пока в макете.</p><iframe title="Satoru на телефоне" src="/redesign/live.html"></iframe><script>for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';for(const x of document.querySelectorAll('[data-width]'))x.setAttribute('aria-pressed',String(x===b));};const screen=new URLSearchParams(location.search).get('screen');if(['goals','settings','plan','rewards','world'].includes(screen)){const route={goals:'#plan/goals',settings:'#settings/',plan:'#plan',rewards:'#rewards',world:'#world/home'}[screen];document.querySelector('iframe').src='/redesign/live.html'+route;document.querySelector('a[href="/redesign/live.html"]').href='/redesign/live.html'+route;}if(screen==='start'){document.querySelector('iframe').src='/redesign/live.html?welcome=1';document.querySelector('p').textContent='Стартовый экран Satoru. Текущая сессия аккаунта сохраняется.';document.querySelector('a[href="/redesign/live.html"]').href='/redesign/live.html?welcome=1';}</script></body></html>
