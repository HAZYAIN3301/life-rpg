<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кот Удачи — paper-doll риг (сфера «Доход»)</title>
<style>
  body { background:#0f1320; color:#e7ebf5; font:14px system-ui; margin:0; padding:24px; }
  h1 { font-size:18px; } .row { display:flex; gap:28px; align-items:flex-end; flex-wrap:wrap; }
  .card { background:#171c2e; border:1px solid #2a3250; border-radius:14px; padding:16px; }
  .muted { color:#99a2c0; font-size:12px; }

  /* ── Риг: позиция на обёртке .fc-p (left/top), АНИМАЦИЯ на вложенном элементе —
     CSS-анимация transform перетирает inline transform (грабля проекта) ── */
  .fcat { display:inline-block; }
  .fc-stage { position:relative; width:600px; height:700px; transform-origin:top left; }
  .fc-p { position:absolute; }
  .fc-p img { display:block; }

  /* группа головы: наклон целиком (голова+пятна+уши+морда) вокруг шеи */
  .fc-headgrp { position:absolute; left:120px; top:108px; width:380px; height:270px; }
  .fc-headanim { position:relative; width:100%; height:100%; transform-origin:50% 92%; animation:headTilt 5.2s ease-in-out infinite; }
  .fc-headanim .fc-p { position:absolute; }

  /* origin = точка КРЕПЛЕНИЯ части к телу (не центр формы) — иначе анимация "отрывает" часть от тела */
  .fc-breathe { transform-origin:50% 100%; animation:breathe 3.4s ease-in-out infinite; } /* тело: пивот у земли */
  .fc-beckon  { transform-origin:50% 97%;  animation:beckon 2.2s ease-in-out infinite; }  /* манэки-лапа: плечо СНИЗУ */
  .fc-coinbob { transform-origin:50% 3%;   animation:coinbob 3.8s ease-in-out infinite; } /* лапа-с-монетой: плечо СВЕРХУ */
  .fc-tailwag { transform-origin:50% 6%;   animation:tailwag 3.0s ease-in-out infinite; } /* хвост: крепится ВЕРХОМ (толстый конец) */
  .fc-bell    { transform-origin:50% 6%;   animation:bellswing 2.2s ease-in-out infinite; }

  @keyframes breathe   { 0%,100% { transform:scaleY(1); } 50% { transform:scaleY(1.016); } }
  @keyframes headTilt  { 0%,100% { transform:rotate(-1.4deg); } 50% { transform:rotate(1.6deg); } }
  @keyframes beckon    { 0%,100% { transform:rotate(-14deg); } 50% { transform:rotate(6deg); } }
  @keyframes coinbob   { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2.5deg); } }
  @keyframes tailwag   { 0%,100% { transform:rotate(-7deg); } 50% { transform:rotate(6deg); } }
  @keyframes bellswing { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
</style>
</head>
<body>
<h1>🐈‍⬛ Кот Удачи (манэки-нэко) — маскот сферы «Доход»</h1>
<p class="muted">Codex-арт → нарезка → paper-doll риг. Слева риг (анимирован), справа оригинал-сборка для сверки.</p>
<div class="row">
  <div class="card">
    <div class="fcat"><div class="fc-stage" id="rig" style="transform:scale(1)"></div></div>
    <div class="muted">риг · манэки-жест · масштаб 1.0 (проверка стыков только так)</div>
  </div>
  <div class="card">
    <img src="art/pets/fortune/assembled.png" width="430" alt="референс">
    <div class="muted">оригинал (Codex, собранный)</div>
  </div>
  <div class="card">
    <div class="fcat"><div class="fc-stage" id="rig-sm" style="transform:scale(.27)"></div></div>
    <div class="muted">масштаб зверинца (~160px)</div>
  </div>
</div>

<script>
// Раскладка (координаты в масштабе исходного листа; head-group — локальные внутри группы).
// z: bag/tail сзади → бёдра → тело → лапа-с-монетой → воротник+бубенец → группа головы → поднятая лапа.
const A = 'art/pets/fortune/';
// ⚠️ body.png УЖЕ включает обе передние лапы (leg_l/leg_r с листа — дубли, НЕ добавлять).
// Метод: стыки вычислены ПОПАРНО из размеров самих частей (референс-сборка на листе оказалась
// ДРУГОГО масштаба, чем части — сеточные замеры с неё не переносятся). Проверять ТОЛЬКО на scale 1.
// Якорь: body (190,300) 227×234. Голова той же ширины, низ головы перекрывает верх тела на ~35 (шея).
// ⚠️ Части на листе нарисованы В РАЗНЫХ МАСШТАБАХ (каждая крупно в своей ячейке):
// воротник 191px при теле 227px, хотя в сборке воротник ~60% ширины тела. Поэтому у части
// есть поле s (индивидуальный масштаб, на обёртке — не конфликтует с анимацией на img).
const LAYOUT = [
  { n:'bag',        x:355, y:280, z:1 },                            // за телом справа, перекрытие
  { n:'tail',       x:155, y:450, z:1, anim:'fc-tailwag' },          // толстый конец сверху, у левого бедра
  { n:'body',       x:190, y:300, z:3, anim:'fc-breathe' },
  { n:'paw_coin',   x:305, y:340, z:4, anim:'fc-coinbob' },          // лапка у правого плеча, монета вниз
  { n:'collar',     x:236, y:344, z:5, s:0.70 },                     // ужат до ~60% ширины тела
  { n:'bell',       x:270, y:392, z:6, s:0.73, anim:'fc-bell' },     // центр воротника
  { n:'paw_raised', x:152, y:178, z:9, anim:'fc-beckon' },           // плечо снизу, за телом
];
// Группа головы (наклон целиком). Группа на (120,100), размер 380×280.
const HEAD = [
  { n:'head',    x:75,  y:38 },              // 217×197, абс: (195,138)
  { n:'patch_l', x:85,  y:43 },
  { n:'patch_r', x:170, y:40 },
  { n:'ear_l',   x:70,  y:22, s:0.9 },       // накрывает левое силуэтное ухо головы
  { n:'ear_r',   x:208, y:14, s:0.9 },       // накрывает правое (оно чуть выше/правее)
  { n:'face',    x:63,  y:68 },              // маска: центр головы по X, ниже ушной зоны
];
function part(p, base) {
  const d = document.createElement('div'); d.className = 'fc-p';
  d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.style.zIndex = p.z || 1;
  // индивидуальный масштаб части — на ОБЁРТКЕ (transform-анимация на img его не перетирает)
  if (p.s) { d.style.transform = `scale(${p.s})`; d.style.transformOrigin = 'top left'; }
  const img = document.createElement('img'); img.src = base + p.n + '.png';
  if (p.anim) img.className = p.anim;
  d.appendChild(img); return d;
}
function buildRig(el) {
  for (const p of LAYOUT.filter(x => x.z < 7)) el.appendChild(part(p, A));
  const grp = document.createElement('div'); grp.className = 'fc-headgrp'; grp.style.zIndex = 8;
  const anim = document.createElement('div'); anim.className = 'fc-headanim';
  for (const p of HEAD) anim.appendChild(part(p, A));
  grp.appendChild(anim); el.appendChild(grp);
  for (const p of LAYOUT.filter(x => x.z >= 7)) el.appendChild(part(p, A));
}
buildRig(document.getElementById('rig'));
buildRig(document.getElementById('rig-sm'));
</script>
</body>
</html>
